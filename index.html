<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving to dpnkrpl.github.io</title>
    
    <meta http-equiv="refresh" content="0; url=https://dpnkrpl.github.io/">
    
    <link rel="canonical" href="https://dpnkrpl.github.io/">

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #8957e5;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: #f0f6fc;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 24px 0;
            color: #8b949e;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            font-weight: 500;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: #9867f0;
        }

        .btn:active {
            transform: scale(0.98);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>

    <script type="text/javascript">
        window.location.href = "https://dpnkrpl.github.io/";
    </script>
</head>
<body>

    <div class="card">
        <div class="icon">🚀</div>
        <h1>We've Moved!</h1>
        <p>deep5050.github.io is transferring you to our new primary domain at <strong>dpnkrpl.github.io</strong>.</p>
        <a href="https://dpnkrpl.github.io/" class="btn">Click here if not redirected</a>
    </div>

</body>
</html>
